<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Activity across your Flowboard projects." /><title>Activity — Flowboard</title>
  <script>try { if (localStorage.getItem('flowboard-ui-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (_) {}</script>
  <link rel="stylesheet" href="../styles.css" /><link rel="stylesheet" href="../detail.css" /><link rel="stylesheet" href="screens.css" /><link rel="stylesheet" href="activity.css?v=1" />
</head>
<body data-page="activity">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app"><aside class="rail" id="rail" aria-label="Workspace navigation"></aside><div class="rail-scrim" id="railScrim" hidden></div><div class="workspace">
    <header class="topbar" id="topbar"></header>
    <main class="page activity-page" id="main">
      <header class="activity-heading"><div><p class="activity-kicker">WORKSPACE</p><h1>Activity</h1><p class="activity-sub">A clear view of recent changes.</p></div><a class="btn activity-project-link" href="projects.html"><svg class="icon" aria-hidden="true"><use href="#i-folder"></use></svg>Browse projects</a></header>
      <section class="activity-overview" aria-label="Activity overview"><span class="overview-mark"><svg class="icon" aria-hidden="true"><use href="#i-activity"></use></svg></span><div class="overview-copy"><strong id="eventTotal">0</strong><span>events</span></div><div class="overview-separator" aria-hidden="true"></div><div class="overview-metric"><svg class="icon" aria-hidden="true"><use href="#i-folder"></use></svg><span><strong id="projectTotal">0</strong> projects</span></div><div class="overview-metric people"><svg class="icon" aria-hidden="true"><use href="#i-users"></use></svg><span><strong id="peopleTotal">0</strong> people</span></div></section>
      <section class="activity-queue" aria-labelledby="feedTitle">
        <div class="activity-queue-head"><div><h2 id="feedTitle">Recent activity</h2><p>Recorded changes across accessible work.</p></div><span class="feed-count" id="feedCount"></span></div>
        <div class="activity-toolbar">
          <label class="activity-search" for="activitySearch"><svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg><span class="sr-only">Search activity</span><input type="search" id="activitySearch" placeholder="Search activity" autocomplete="off" /></label>
          <label class="activity-filter"><span class="sr-only">Project</span><select id="activityProject" aria-label="Filter by project"></select><svg class="icon" aria-hidden="true"><use href="#i-chevron-down"></use></svg></label>
          <label class="activity-filter"><span class="sr-only">Person</span><select id="activityActor" aria-label="Filter by person"></select><svg class="icon" aria-hidden="true"><use href="#i-chevron-down"></use></svg></label>
          <label class="activity-filter"><span class="sr-only">Action</span><select id="activityAction" aria-label="Filter by action"></select><svg class="icon" aria-hidden="true"><use href="#i-chevron-down"></use></svg></label>
          <label class="activity-filter"><span class="sr-only">Date</span><select id="activityDate" aria-label="Filter by date"><option value="all">All dates</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="90">Last 90 days</option></select><svg class="icon" aria-hidden="true"><use href="#i-chevron-down"></use></svg></label>
          <button class="activity-clear" id="resetFilters" type="button" hidden>Clear filters</button>
        </div>
        <div class="activity-results"><span id="filterNote" aria-live="polite"></span><span>Newest first</span></div>
        <div id="feedPanel"></div>
        <div class="activity-more"><span id="loadNote"></span><button class="btn" type="button" id="loadMoreBtn">Load more</button></div>
      </section>
      <p class="activity-foot">Preview data · Some projects have no recorded preview history</p>
    </main>
  </div></div>
  <script src="../data.js"></script><script src="data.js"></script><script src="screens.js"></script><script src="portfolio-model.js"></script><script src="activity.js?v=2"></script>
</body></html>
