<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Recently deleted cards in Flowboard." /><title>Trash — Flowboard</title>
  <script>try { if (localStorage.getItem('flowboard-ui-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (_) {}</script>
  <link rel="stylesheet" href="../styles.css" /><link rel="stylesheet" href="../detail.css" /><link rel="stylesheet" href="screens.css" /><link rel="stylesheet" href="trash.css?v=1" />
</head>
<body data-page="trash">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app"><aside class="rail" id="rail" aria-label="Workspace navigation"></aside><div class="rail-scrim" id="railScrim" hidden></div><div class="workspace">
    <header class="topbar" id="topbar"></header>
    <main class="page recovery-page" id="main">
      <div id="trashContent" hidden>
        <header class="recovery-heading"><div><h1>Trash</h1></div><a class="btn recovery-project-link" href="projects.html"><svg class="icon" aria-hidden="true"><use href="#i-folder"></use></svg>Browse projects</a></header>
        <section class="recovery-overview" aria-label="Recovery overview"><span class="overview-mark"><svg class="icon" aria-hidden="true"><use href="#i-restore"></use></svg></span><div class="overview-copy"><strong id="statTotal">0</strong><span>deleted cards</span></div><div class="overview-separator" aria-hidden="true"></div><div class="overview-metric available"><svg class="icon" aria-hidden="true"><use href="#i-check-circle"></use></svg><span><strong id="statRestorable">0</strong> within window</span></div><div class="overview-metric soon" id="expiringMetric"><svg class="icon" aria-hidden="true"><use href="#i-clock"></use></svg><span><strong id="statExpiring">0</strong> expiring soon</span></div></section>
        <section class="recovery-queue" aria-labelledby="trashTitle">
          <div class="recovery-queue-head"><div><h2 id="trashTitle">Deleted cards</h2><p>Recovery window: 24 hours</p></div><span class="recovery-count" id="trashCount">0 cards</span></div>
          <div class="recovery-toolbar"><label class="recovery-search" for="trashSearch"><svg class="icon" aria-hidden="true"><use href="#i-search"></use></svg><span class="sr-only">Search deleted cards</span><input type="search" id="trashSearch" placeholder="Search deleted cards" autocomplete="off" /></label><label class="recovery-filter"><span class="sr-only">Project</span><select id="trashProject" aria-label="Filter by project"></select><svg class="icon" aria-hidden="true"><use href="#i-chevron-down"></use></svg></label><button class="recovery-clear" id="clearTrashFilters" type="button" hidden>Clear filters</button></div>
          <div class="recovery-results"><span id="filterNote" aria-live="polite"></span><span>Nearest deadline first</span></div>
          <div id="trashList"></div>
        </section>
        <p class="recovery-foot" id="previewNote"><svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg>Preview only · Restore unavailable · Times use this device’s clock</p>
      </div>
      <section id="trashDenied" hidden></section>
    </main>
  </div></div>
  <script src="../data.js"></script><script src="data.js"></script><script src="screens.js"></script><script src="portfolio-model.js"></script><script src="trash.js?v=2"></script>
</body></html>
