<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Flowboard sign-in page design preview." />
  <title>Sign in — Flowboard</title>
  <script>
    (() => {
      const query = new URLSearchParams(window.location.search);
      const root = document.documentElement;
      const palette = query.get("palette");
      const requestedTheme = query.get("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
      root.dataset.palette = /^[123]$/.test(palette || "") ? palette : "1";
      const applyTheme = () => {
        root.dataset.theme = requestedTheme === "dark" || requestedTheme === "light"
          ? requestedTheme
          : prefersDark.matches ? "dark" : "light";
      };
      applyTheme();
      if (requestedTheme !== "dark" && requestedTheme !== "light") {
        prefersDark.addEventListener("change", applyTheme);
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="signin.css" />
  <link rel="stylesheet" href="signin-palettes.css" />
</head>
<body class="signin-page" data-page="signin">
  <a class="skip-link" href="#signinMain">Skip to sign in</a>

  <main class="signin-shell" id="signinMain">
    <section class="signin-panel" aria-labelledby="signinTitle">
      <a class="signin-brand" href="../index.html" aria-label="Flowboard sign-in preview">
        <span class="brand-wordmark">Flowboard</span>
      </a>

      <div class="signin-content">
        <p class="signin-kicker">Welcome back</p>
        <h1 id="signinTitle">Sign in with <span class="brand-wordmark">Flowboard</span></h1>

        <button class="signin-google" id="googleSignIn" type="button" aria-describedby="signinNote">
          <svg class="google-mark" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#4285F4" d="M43.611 20.083H42V20H24v8h11.303a12 12 0 0 1-4.193 6.257v5.146h6.785c3.973-3.662 6.267-9.053 6.267-15.403 0-1.354-.131-2.657-.551-3.917Z" />
            <path fill="#34A853" d="M24 44c5.67 0 10.423-1.882 13.895-5.097l-6.785-5.146c-1.882 1.265-4.289 2.018-7.11 2.018-5.47 0-10.11-3.693-11.766-8.658H5.24v5.307A20.98 20.98 0 0 0 24 44Z" />
            <path fill="#FBBC05" d="M12.234 27.117a12.58 12.58 0 0 1 0-8.234v-5.307H5.24a20.99 20.99 0 0 0 0 18.848l6.994-5.307Z" />
            <path fill="#EA4335" d="M24 8.225c3.09 0 5.862 1.063 8.045 3.15l6.036-6.036C34.414 1.995 29.663 0 24 0A20.98 20.98 0 0 0 5.24 13.576l6.994 5.307C13.89 11.918 18.53 8.225 24 8.225Z" />
          </svg>
          <span>Continue with Google</span>
        </button>

        <p class="signin-note" id="signinNote">Design preview. Google sign-in isn’t connected yet.</p>
        <p class="signin-alert" id="signinAlert" role="alert" hidden></p>
        <p class="signin-status" id="signinStatus" role="status" aria-live="polite" hidden></p>
      </div>
    </section>

    <aside class="signin-showcase" aria-label="Sample Flowboard board">
      <div class="showcase-topline">
        <span class="showcase-brand">
          <span class="brand-wordmark">Flowboard</span>
        </span>
        <span class="showcase-tag">Board preview</span>
      </div>

      <figure class="showcase-board">
        <figcaption class="showcase-board-head">
          <div>
            <p class="showcase-project">Website redesign</p>
            <h2>Team board</h2>
          </div>
          <span class="showcase-people" aria-label="Three teammates">
            <span class="showcase-avatar avatar-one" aria-hidden="true">A</span>
            <span class="showcase-avatar avatar-two" aria-hidden="true">M</span>
            <span class="showcase-avatar avatar-three" aria-hidden="true">J</span>
          </span>
        </figcaption>

        <div class="showcase-columns">
          <section class="showcase-column" aria-labelledby="columnTodo">
            <h3 id="columnTodo"><span class="status-dot todo-dot"></span>Not started <span>2</span></h3>
            <article class="showcase-task">
              <span class="task-priority priority-low">Low</span>
              <p>Gather launch requirements</p>
              <span class="task-assignee avatar-two" aria-label="Assigned to Morgan">M</span>
            </article>
            <article class="showcase-task">
              <span class="task-priority priority-medium">Medium</span>
              <p>Review onboarding notes</p>
              <span class="task-assignee avatar-one" aria-label="Assigned to Alex">A</span>
            </article>
          </section>

          <section class="showcase-column" aria-labelledby="columnActive">
            <h3 id="columnActive"><span class="status-dot active-dot"></span>In progress <span>1</span></h3>
            <article class="showcase-task">
              <span class="task-priority priority-high">High</span>
              <p>Shape the sign-in flow</p>
              <span class="task-assignee avatar-three" aria-label="Assigned to Jamie">J</span>
            </article>
          </section>

          <section class="showcase-column" aria-labelledby="columnTesting">
            <h3 id="columnTesting"><span class="status-dot testing-dot"></span>Testing <span>1</span></h3>
            <article class="showcase-task">
              <span class="task-priority priority-medium">Medium</span>
              <p>Check mobile layout</p>
              <span class="task-assignee avatar-one" aria-label="Assigned to Alex">A</span>
            </article>
          </section>

          <section class="showcase-column" aria-labelledby="columnDone">
            <h3 id="columnDone"><span class="status-dot done-dot"></span>Completed <span>1</span></h3>
            <article class="showcase-task">
              <span class="task-priority priority-done">Done</span>
              <p>Set up the project board</p>
              <span class="task-assignee avatar-two" aria-label="Assigned to Morgan">M</span>
            </article>
          </section>
        </div>
      </figure>

    </aside>
  </main>

  <script src="signin.js"></script>
</body>
</html>
