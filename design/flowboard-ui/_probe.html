<!doctype html>
<html><head><meta charset="utf-8"><title>Inbox probe</title>
<style>body{margin:0;background:#222}iframe{border:0;display:block;background:#fff}</style></head>
<body>
<iframe id="f" width="1440" height="900" src="/screens/inbox.html"></iframe>
<script>
  var f = document.getElementById('f');
  window.probeLoad = function (w, h, src) {
    return new Promise(function (resolve) {
      f.width = w; f.height = h;
      f.onload = function () { setTimeout(resolve, 700); };
      f.src = src;
    });
  };
  window.probeSrc = function (w, h, html) {
    return new Promise(function (resolve) {
      f.width = w; f.height = h;
      f.onload = function () { setTimeout(resolve, 700); };
      f.srcdoc = html;
    });
  };
  window.probeDoc = function () { return f.contentDocument; };
  window.probeWin = function () { return f.contentWindow; };
</script>
</body></html>
