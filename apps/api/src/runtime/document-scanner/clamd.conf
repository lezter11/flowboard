# Keep this daemon private. The HTTP service forwards bytes over this Unix socket.
Foreground yes
LocalSocket /run/flowboard-scanner/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
DatabaseDirectory /var/lib/clamav
SelfCheck 60
ConcurrentDatabaseReload no
AlertExceedsMax yes
AlertEncrypted yes
StreamMaxLength 1048576
MaxFileSize 16M
MaxScanSize 32M
MaxScanTime 3000
MaxRecursion 8
MaxFiles 40
MaxThreads 2
MaxQueue 8
ReadTimeout 4
CommandReadTimeout 4
SendBufTimeout 1000
ScanPDF yes
ScanArchive yes
ScanXMLDOCS yes
