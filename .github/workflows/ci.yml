name: CI

on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feat/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Typecheck, Tests, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flowboard_ci
          POSTGRES_PASSWORD: flowboard_ci_password
          POSTGRES_DB: flowboard_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Monorepo Typecheck
        run: |
          npm run typecheck
          npm run typecheck:web

      - name: Contracts Tests
        run: npm test --workspace @flowboard/contracts

      - name: API Test Suite (Ephemeral Postgres)
        env:
          DATABASE_URL: postgres://flowboard_ci:flowboard_ci_password@127.0.0.1:5432/flowboard_ci_test
          ALLOW_REMOTE_DB: 'false'
        run: npm test --workspace @flowboard/api

      - name: Next.js Web Build
        run: npm run build:web
