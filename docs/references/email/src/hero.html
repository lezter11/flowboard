<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:transparent;width:600px;height:300px;overflow:hidden;}
.board{width:600px;height:200px;margin-top:50px;display:flex;gap:24px;justify-content:center;align-items:flex-start;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;}
.col{width:168px;height:200px;border-radius:16px;background:rgba(255,255,255,0.92);box-sizing:border-box;padding:12px 12px;box-shadow:0 1px 0 rgba(48,38,56,0.06);}
.head{display:flex;align-items:center;gap:8px;height:26px;border-radius:999px;padding:0 10px;font-size:13px;font-weight:700;color:#2d2532;}
.dot{width:8px;height:8px;border-radius:50%;}
.card{margin-top:10px;border-radius:12px;background:#ffffff;box-shadow:0 1px 2px rgba(48,38,56,0.10);padding:10px 10px 10px 14px;position:relative;}
.card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:2px;}
.l{height:7px;border-radius:4px;background:#e9e1ef;margin-top:6px;}
.l.s{width:55%;} .l.m{width:78%;}
.t1{background:#cdb4db;} .t2{background:#ffc8dd;} .t3{background:#bde0fe;} .t4{background:#b8f2c8;}
.h1{background:#cdb4db;} .h2{background:#bde0fe;} .h3{background:#b8f2c8;}
.p1::before{background:#ffafcc;} .p2::before{background:#a2d2ff;} .p3::before{background:#cdb4db;}
</style></head><body>
<div class="board">
  <div class="col">
    <div class="head" style="background:#cdb4db;">To do</div>
    <div class="card p1"><div class="l m"></div><div class="l s"></div></div>
    <div class="card p2"><div class="l m"></div></div>
  </div>
  <div class="col">
    <div class="head" style="background:#bde0fe;">Doing</div>
    <div class="card p3"><div class="l m"></div><div class="l s"></div></div>
    <div class="card p1"><div class="l s"></div><div class="l m"></div></div>
  </div>
  <div class="col">
    <div class="head" style="background:#b8f2c8;">Done</div>
    <div class="card p2"><div class="l m"></div><div class="l s"></div></div>
  </div>
</div>
</body></html>
